<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" />
      <stop offset="50%" stop-color="#0b1a3a" />
      <stop offset="100%" stop-color="#050a18" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Circular Radar / Reel Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.2" />

  <!-- Fishing Hook Vector -->
  <path d="M 170 120 L 170 330 C 170 395 240 435 295 400 C 340 370 345 315 345 285 L 345 250 M 345 250 L 325 275" 
        fill="none" stroke="#94a3b8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Hook Eye -->
  <circle cx="170" cy="120" r="28" fill="none" stroke="#94a3b8" stroke-width="16" />
  <circle cx="170" cy="120" r="14" fill="#0a1329" />

  <!-- Standing Line (Vibrant Teal) entering hook eye and forming knot -->
  <path d="M 170 40 L 170 120 C 170 120 180 180 230 180 C 280 180 300 220 270 250 C 240 280 190 260 200 220 C 210 180 270 160 280 120 L 280 50" 
        fill="none" stroke="url(#tealGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />

  <!-- Tag End Line (Golden Amber) wrapped -->
  <path d="M 230 180 C 260 195 285 170 260 145 C 235 120 195 145 210 170 C 220 190 270 200 300 230" 
        fill="none" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 0" />

  <!-- Fish silhouette / knot accent small badge -->
  <circle cx="360" cy="150" r="12" fill="#2dd4bf" />
  <circle cx="360" cy="150" r="24" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.4" />
</svg>
